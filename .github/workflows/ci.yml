name: CI

# This fork builds only the Windows executable.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: [self-hosted, ely-windows]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install --no-self-update
      - name: Build the Windows executable
        run: scripts/windows-zip.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: elyterminal-windows
          path: target/release/ELYTerminal-*-windows-*.zip
